<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sistemi Purepower — filter tooling register</title>
    <meta name="description" content="Search a filter and see every tool it needs: photo, dimensions, condition, shelf and production readiness." />
    <meta name="theme-color" content="#0b5cff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SP Tooling" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <noscript>
      <div style="font: 15px/1.5 system-ui, sans-serif; padding: 24px; max-width: 640px; margin: 0 auto">
        <h1>Sistemi Purepower tooling register</h1>
        <p>
          This app needs JavaScript: it is a single page application that talks to the REST API on this server. Enable
          JavaScript, or open the API directly at <code>/api/health</code> to check that the server is alive.
        </p>
      </div>
    </noscript>

    <!-- The app replaces this shell once it has loaded (no inline scripts: the CSP allows 'self' only). -->
    <div id="boot" style="font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif; padding: 28px 18px; max-width: 520px; margin: 0 auto">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: #0b5cff; color: #fff; font-weight: 800">SP</span>
        <strong>Sistemi Purepower — filter tooling register</strong>
      </div>
      <p style="color: #475569; margin-top: 14px">Loading the register…</p>
      <p style="color: #94a3b8; font-size: 12.5px">
        If this message stays on screen, the app script did not load: run <code>npm install</code> and
        <code>npm run setup</code>, then reload.
      </p>
    </div>

    <!-- Vendored decoder libraries (installed locally, served from /vendor): QR first, 1-D barcodes as the fallback. -->
    <script src="/vendor/jsqr.js"></script>
    <script src="/vendor/zxing.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
